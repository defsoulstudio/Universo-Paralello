            } catch (err) {
                console.warn("Auth fallback:", err);
                try { await signInAnonymously(auth); } catch(e) {}
            }

            const itemsColRef = collection(db, 'artifacts', appId, 'public', 'data', 'checklist_items');
            
            // Check if collection is empty, seed defaults if needed
            const snapshot = await getDocs(itemsColRef);
            if (snapshot.empty) {
                for (const defItem of defaultItems) {
                    await setDoc(doc(itemsColRef, defItem.id), defItem);
                }
            }

            // Real-time listener
            onSnapshot(itemsColRef, (querySnapshot) => {
                const loaded = [];
                querySnapshot.forEach((docSnap) => {
                    loaded.push({ id: docSnap.id, ...docSnap.data() });
                });
                items = loaded.sort((a, b) => a.name.localeCompare(b.name));
                
                document.getElementById('sync-indicator').className = "w-2.5 h-2.5 rounded-full bg-green-400";
                document.getElementById('sync-text').innerText = "Sincronizado em tempo real";
                render();
            }, (error) => {
                console.error("Firestore sync error:", error);
                document.getElementById('sync-indicator').className = "w-2.5 h-2.5 rounded-full bg-red-500";
                document.getElementById('sync-text').innerText = "Erro de conexão ao vivo";
            });
        }

        window.filterCategory = function(cat) {
            currentCategoryFilter = cat;
            document.querySelectorAll('.category-tab').forEach(tab => {
                tab.classList.remove('bg-up-sunsetOrange', 'text-white');
                tab.classList.add('bg-up-cardBg', 'border', 'border-up-turquoise/30', 'text-gray-300');
            });
            const active = document.getElementById(`tab-${cat}`);
            if (active) {
                active.classList.remove('bg-up-cardBg', 'border', 'border-up-turquoise/30', 'text-gray-300');
                active.classList.add('bg-up-sunsetOrange', 'text-white');
            }
            render();
        }

        window.toggleItem = async function(id) {
            const item = items.find(i => i.id === id);
            if (!item) return;
            item.completed = !item.completed;
            item.statusTag = item.completed ? "Já Tenho / Comprado" : "Pendente";
            
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'checklist_items', String(id));
            await setDoc(docRef, item, { merge: true });
        }

        window.updatePrice = async function(id, val) {
            const item = items.find(i => i.id === id);
            if (!item) return;
            item.price = parseFloat(val) || 0;
            
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'checklist_items', String(id));
            await setDoc(docRef, item, { merge: true });
        }

        window.toggleStatusTag = async function(id) {
            const item = items.find(i => i.id === id);
            if (!item) return;
            if (item.statusTag === "Pendente") {
                item.statusTag = "Já Tenho";
                item.completed = true;
            } else if (item.statusTag === "Já Tenho") {
                item.statusTag = "Comprado";
                item.completed = true;
            } else {
                item.statusTag = "Pendente";
                item.completed = false;
            }
            
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'checklist_items', String(id));
            await setDoc(docRef, item, { merge: true });
        }

        window.deleteItem = async function(id) {
            if (confirm('Deseja realmente remover este item da lista compartilhada?')) {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'checklist_items', String(id));
                await deleteDoc(docRef);
            }
        }

        window.openAddModal = function() {
            document.getElementById('modal-title').innerHTML = '<i class="fa-solid fa-circle-plus text-up-sunsetOrange"></i> Adicionar Item';
            document.getElementById('item-id').value = '';
            document.getElementById('modal-name').value = '';
            document.getElementById('modal-price').value = '';
            document.getElementById('item-modal').classList.remove('hidden');
        }

        window.closeModal = function() {
            document.getElementById('item-modal').classList.add('hidden');
        }

        window.saveItem = async function(e) {
            e.preventDefault();
            const idVal = document.getElementById('item-id').value;
            const name = document.getElementById('modal-name').value;
            const category = document.getElementById('modal-category').value;
            const price = parseFloat(document.getElementById('modal-price').value) || 0;
            const id = idVal ? idVal : 'item_' + Date.now();

            const newItem = {
                id,
                name,
                category,
                completed: false,
                price,
                statusTag: "Pendente"
            };

            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'checklist_items', String(id));
            await setDoc(docRef, newItem, { merge: true });
            closeModal();
        }

        window.exportSummary = function() {
            const completed = items.filter(i => i.completed).length;
            const total = items.length;
            const totalPrice = items.reduce((sum, i) => sum + (parseFloat(i.price) || 0), 0);
            
            let text = `✨ *CHECKLIST UNIVERSO PARALELLO 19ª EDIÇÃO* ✨\n`;
            text += `Progresso: ${completed}/${total} (${Math.round((completed/total)*100)}%)\n`;
            text += `Orçamento Total: ${totalPrice.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'})}\n\n`;

            const categories = [...new Set(items.map(i => i.category))];
            categories.forEach(cat => {
                const catItems = items.filter(i => i.category === cat);
                text += `📁 *${cat}*\n`;
                catItems.forEach(i => {
                    text += `${i.completed ? '✅' : '⏳'} ${i.name} ${i.price > 0 ? `(R$ ${i.price.toFixed(2)})` : ''}\n`;
                });
                text += `\n`;
            });

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    alert('Resumo copiado com sucesso para enviar no grupo!');
                }).catch(() => {
                    prompt('Copie o resumo abaixo:', text);
                });
            } else {
                prompt('Copie o resumo abaixo:', text);
            }
        }

        function render() {
            const container = document.getElementById('categories-container');
            container.innerHTML = '';

            let filtered = items.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(searchQuery);
                const matchesCategory = currentCategoryFilter === 'all' || item.category === currentCategoryFilter;
                let matchesStatus = true;
                if (currentStatusFilter === 'completed') matchesStatus = item.completed;
                if (currentStatusFilter === 'pending') matchesStatus = !item.completed;
                return matchesSearch && matchesCategory && matchesStatus;
            });

            const categoryConfigs = [
                { name: "Utensílios e Acampamento", icon: "fa-tent", color: "text-up-sunsetOrange" },
                { name: "Acessórios e Conforto", icon: "fa-glasses", color: "text-up-turquoise" },
                { name: "Roupas e Vestuário", icon: "fa-shirt", color: "text-up-gold" },
                { name: "Higiene e Cuidados Pessoais", icon: "fa-pump-soap", color: "text-up-cyanGlow" },
                { name: "Farmácia e Primeiros Socorros", icon: "fa-kit-medical", color: "text-up-coral" },
                { name: "Alimentação e Suplementos", icon: "fa-bolt", color: "text-up-gold" }
            ];

            let hasVisible = false;

            categoryConfigs.forEach(cat => {
                const catItems = filtered.filter(i => i.category === cat.name);
                if (catItems.length === 0) return;

                hasVisible = true;
                const totalCatItems = items.filter(i => i.category === cat.name);
                const completedCount = totalCatItems.filter(i => i.completed).length;
                const totalCount = totalCatItems.length;
                const pct = Math.round((completedCount / totalCount) * 100) || 0;

                const card = document.createElement('div');
                card.className = "bg-up-cardBg backdrop-blur-md poster-border rounded-3xl p-4 sm:p-6 shadow-2xl transition-all";

                let itemsHtml = '';
                catItems.forEach(item => {
                    let badgeColor = "bg-yellow-500/20 text-yellow-300 border-yellow-500/40";
                    if (item.statusTag === "Já Tenho") badgeColor = "bg-up-turquoise/20 text-up-turquoise border-up-turquoise/40";
                    if (item.statusTag === "Comprado") badgeColor = "bg-green-500/20 text-green-300 border-green-500/40";

                    itemsHtml += `
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 p-3.5 rounded-2xl bg-up-navy/60 border border-up-turquoise/20 hover:border-up-turquoise/50 transition-all">
                            <div class="flex items-center gap-3.5 flex-1 min-w-0">
                                <input type="checkbox" ${item.completed ? 'checked' : ''} onchange="toggleItem('${item.id}')" class="w-6 h-6 accent-up-sunsetOrange rounded cursor-pointer shrink-0">
                                <span class="text-sm font-medium break-words ${item.completed ? 'line-through text-gray-500' : 'text-gray-100'}">${item.name}</span>
                            </div>
                            <div class="flex items-center gap-2.5 shrink-0 justify-between sm:justify-end">
                                <button onclick="toggleStatusTag('${item.id}')" class="px-2.5 py-1 rounded-xl text-[11px] font-bold border ${badgeColor} cursor-pointer transition-all">
                                    ${item.statusTag || 'Pendente'}
                                </button>
                                <div class="relative">
                                    <span class="absolute left-2 top-1/2 -translate-y-1/2 text-[10px] text-gray-400 font-semibold">R$</span>
                                    <input type="number" step="0.01" min="0" value="${item.price || ''}" placeholder="0,00" onchange="updatePrice('${item.id}', this.value)" class="w-24 sm:w-28 bg-up-navy border-2 border-up-turquoise/30 rounded-xl pl-7 pr-2 py-1.5 text-xs text-gray-100 focus:outline-none focus:border-up-sunsetOrange text-right">
                                </div>
                                <button onclick="deleteItem('${item.id}')" class="text-gray-500 hover:text-red-400 p-1.5 transition-all cursor-pointer" title="Remover">
                                    <i class="fa-solid fa-trash-can text-xs"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4 pb-3 border-b border-up-turquoise/20">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-2xl bg-up-navy border border-up-turquoise/30 flex items-center justify-center ${cat.color} text-lg shadow-inner shrink-0">
                                <i class="fa-solid ${cat.icon}"></i>
                            </div>
                            <div>
                                <h2 class="text-base font-bold text-white font-display">${cat.name}</h2>
                                <p class="text-[11px] text-up-cyanGlow">${completedCount} de ${totalCount} prontos</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2.5">
                            <div class="w-28 sm:w-36 bg-up-navy rounded-full h-2.5 border border-up-turquoise/30 overflow-hidden shadow-inner">
                                <div class="bg-gradient-to-r from-up-sunsetOrange via-up-gold to-up-turquoise h-2.5 rounded-full transition-all duration-500" style="width: ${pct}%"></div>
                            </div>
                            <span class="text-xs font-bold text-up-gold w-8 text-right">${pct}%</span>
                        </div>
                    </div>
                    <div class="space-y-2.5">
                        ${itemsHtml}
                    </div>
                `;

                container.appendChild(card);
            });

            if (!hasVisible) {
                container.innerHTML = `
                    <div class="text-center py-16 bg-up-cardBg border border-up-turquoise/30 rounded-3xl">
                        <i class="fa-solid fa-compass text-4xl text-up-turquoise/40 mb-3 animate-bounce"></i>
                        <h3 class="text-base font-bold text-gray-300">Nenhum item encontrado</h3>
                        <p class="text-xs text-gray-500 mt-1">Tente ajustar sua busca ou filtro.</p>
                    </div>
                `;
            }

            updateStats();
        }

        function updateStats() {
            const totalCount = items.length;
            const completedCount = items.filter(i => i.completed).length;
            const pct = Math.round((completedCount / totalCount) * 100) || 0;
            const totalPrice = items.reduce((sum, i) => sum + (parseFloat(i.price) || 0), 0);

            document.getElementById('stat-completed').innerText = `${completedCount}/${totalCount}`;
            document.getElementById('stat-percent').innerText = `${pct}%`;
            document.getElementById('stat-total').innerText = totalPrice.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase();
            render();
        });

        document.getElementById('filter-status').addEventListener('change', (e) => {
            currentStatusFilter = e.target.value;
            render();
        });

        window.onload = function() {
            initAuthAndData();
        };
    </script>
</body>
</html>
